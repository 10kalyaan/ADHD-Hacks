<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>New Tab — ND Tab Nudger</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <main class="wrap">
    <form class="search" id="search-form" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" /><line x1="16.5" y1="16.5" x2="21" y2="21" />
      </svg>
      <input
        id="search-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search or type a URL"
        aria-label="Search or type a URL"
      />
    </form>

    <h1 class="greeting" id="greeting">Hello</h1>

    <section class="stats" aria-label="Session overview">
      <div class="tile">
        <span class="tile-label">Tabs open</span>
        <strong class="tile-value" id="stat-open">–</strong>
      </div>
      <div class="tile">
        <span class="tile-label">Closed this session</span>
        <strong class="tile-value" id="stat-closed">–</strong>
      </div>
      <div class="tile">
        <span class="tile-label">Longest waiting</span>
        <strong class="tile-value" id="stat-oldest">–</strong>
      </div>
    </section>

    <div class="grid">
      <div class="side">
      <section class="panel" aria-labelledby="split-heading">
        <h2 class="panel-title" id="split-heading">Today's split</h2>

        <div class="split">
          <svg
            class="pie"
            id="pie"
            viewBox="0 0 100 100"
            role="img"
            aria-labelledby="pie-desc"
          ></svg>
          <p id="pie-desc" class="visually-hidden"></p>
          <ul class="legend" id="legend"></ul>
        </div>

        <h3 class="panel-subtitle">Where they live</h3>
        <ul class="domains" id="domains"></ul>
      </section>

      <section class="panel" aria-labelledby="open-heading">
        <h2 class="panel-title" id="open-heading">Everything else that&rsquo;s open</h2>
        <ul class="tab-list" id="tab-list"></ul>
      </section>

      </div>

      <div class="side">
        <section class="panel garden" aria-labelledby="garden-heading">
          <div class="panel-head">
            <h2 class="panel-title" id="garden-heading">Your garden today</h2>
            <span class="garden-count" id="garden-count"></span>
          </div>
          <div class="sprouts" id="sprouts" aria-hidden="true"></div>
          <p class="garden-note" id="garden-note">
            Every tab you act on plants something new. Nothing here ever wilts.
          </p>
        </section>

        <section id="cards" class="cards" aria-label="Suggested tabs"></section>

      </div>
    </div>
  </main>

  <script src="../shared/api-client.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
