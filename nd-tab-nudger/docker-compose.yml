services:
  vectorai:
    image: actian/vectorai:latest
    container_name: vectorai
    ports:
      - "6573:6573"  # REST
      - "6574:6574"  # gRPC — what the Python SDK connects to
      - "6575:6575"  # local web UI, handy for eyeballing collections in the demo
    volumes:
      - vectorai-data:/var/lib/actian-vectorai
    environment:
      # Container refuses to start without this.
      - ACTIAN_VECTORAI_ACCEPT_EULA=YES
    restart: unless-stopped

volumes:
  vectorai-data:
